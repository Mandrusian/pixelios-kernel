name: xnu

# Builds the patched XNU kernel on a GitHub-hosted macOS runner (free for public repositories).
# The kernel sources are not in this repository: blacktop/darwin-xnu-build downloads Apple's
# open-source XNU for the chosen macOS release and applies xnu/patches/ on top.

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, the iOS 16 generation)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: SWEET
  push:
    branches: [main, phase5-macos15-toolchain-probe-ci, phase7c12-raven-usbroot-build-ci, phase7d13-exec-failure-diagnostics-20261031]
    paths:
      - "xnu/patches/**"
      - "upstream-patches/**"
      - "tools/setup-upstream.sh"
      - ".github/workflows/xnu.yml"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'SWEET' }}

jobs:
  host-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: tools/setup-upstream.sh
      - name: QR log round trip
        run: |
          pip install opencv-python-headless numpy
          python3 tools/qr-log.py --selftest

  kernel:
    # Toolchain compatibility experiment; xnu-8796 has previously depended on Xcode 15 iig.
    # Explicitly test Xcode 16.0 on maintained macOS 15 runners, preserving the existing build branch.
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: tools/setup-upstream.sh

      - name: Fetch the build script and add our patches
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/ 2>/dev/null || cp xnu/patches/*.patch dxb/patches/
          for name in \
            0102-sweet-usb-ecm-block-probe.patch \
            0103-sweet-usb-rootless-probe-window.patch \
            0104-sweet-usb-gs101-phy-command-guard.patch \
            0105-sweet-usbroot-readonly-disk.patch \
            0106-sweet-usbroot-hfs-mount-trace.patch \
            0200-raven-pid1-ios-launchd-platform.patch; do
            test -s "dxb/patches/$name" || { echo "::error::Missing $name"; exit 1; }
          done
          echo '=== Hardware-proven USBROOT patches + PID1 platform fix ==='
          shasum -a 256 \
            dxb/patches/0102-sweet-usb-ecm-block-probe.patch \
            dxb/patches/0103-sweet-usb-rootless-probe-window.patch \
            dxb/patches/0104-sweet-usb-gs101-phy-command-guard.patch \
            dxb/patches/0105-sweet-usbroot-readonly-disk.patch \
            dxb/patches/0106-sweet-usbroot-hfs-mount-trace.patch \
            dxb/patches/0200-raven-pid1-ios-launchd-platform.patch

          # libfirehose_kernel is built arm64e-only upstream; this kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh

      - name: Dependencies
        run: |
          brew install jq gum bash cmake ninja
          # build.sh only checks that `xcodes` exists; Xcode is preinstalled on the runner
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          XC=/Applications/Xcode_16.app
          test -d "$XC/Contents/Developer" || { echo "::error::Missing Xcode 16.0 on macos-15"; exit 1; }
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          echo '=== iig path / version ==='
          xcrun -f iig || true
          xcrun iig --version || true

      - name: Build
        working-directory: dxb
        run: bash build.sh

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn
