name: sbfix
on:
  workflow_dispatch:
  push:
    paths: ["sbfix/**", ".github/workflows/sbfix.yml"]
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - run: |
          export DEVELOPER_DIR=/Applications/Xcode_16.app/Contents/Developer
          cd sbfix
          xcrun --sdk iphoneos clang -arch arm64e -miphoneos-version-min=16.0 -dynamiclib -O2 -o libsbfix.dylib sbfix.c -install_name /usr/lib/libsbfix.dylib -lobjc
          codesign -f -s - libsbfix.dylib
          file libsbfix.dylib; otool -L libsbfix.dylib; shasum -a 256 libsbfix.dylib | tee SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: sbfix
          path: |
            sbfix/libsbfix.dylib
            sbfix/SHA256
